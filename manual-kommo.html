<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Buscador de tutoriales en video del manual de onboarding de Kommo CRM.">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Manual de onboarding Kommo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EBEBEE; --card:#FCFCFD; --card-hover:#FFFFFF; --line:#DADADF; --line-soft:#E6E6EA;
  --ink:#0B0B0D; --ink-2:#2E2E33; --muted:#7F8090;
  --p-500:#7C47FF; --p-600:#6400E6; --p-top:#852EF7; --p-soft:#F3F1FF; --p-soft-2:#EAE6FF;
  --mark:#EAE6FF; --mark-ink:#4B12C9;
  --tab-shadow:0 2px 4px rgba(0,0,0,.06),0 4px 8px rgba(0,0,0,.1);
  --focus:0 0 0 3px rgba(124,71,255,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#131316; --card:#17171A; --card-hover:#1C1C20; --line:#2B2B31; --line-soft:#232328;
    --ink:#F4F4F5; --ink-2:#DFDFE2; --muted:#8E8FA0;
    --p-500:#9B74FF; --p-soft:#231B3D; --p-soft-2:#2D2250;
    --mark:#3A2A70; --mark-ink:#E6DDFF;
    --tab-shadow:0 2px 4px rgba(0,0,0,.35),0 4px 8px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#131316; --card:#17171A; --card-hover:#1C1C20; --line:#2B2B31; --line-soft:#232328;
  --ink:#F4F4F5; --ink-2:#DFDFE2; --muted:#8E8FA0;
  --p-500:#9B74FF; --p-soft:#231B3D; --p-soft-2:#2D2250;
  --mark:#3A2A70; --mark-ink:#E6DDFF;
  --tab-shadow:0 2px 4px rgba(0,0,0,.35),0 4px 8px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.5 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus)}

/* Header */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;text-decoration:none;border-radius:8px}
.brand img{display:block;height:44px;width:auto}
.brand-side{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
header.top{padding-block:40px 20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:600px){.brand img{height:34px}.brand-side .txt{display:none}}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--p-soft);color:var(--p-500);font-size:14px;font-weight:500;padding:4px 12px;border-radius:24px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
h1{font-size:clamp(32px,6vw,48px);line-height:1.08;font-weight:600;letter-spacing:-.025em;margin:0;text-wrap:balance}
.lede{color:var(--muted);font-size:18px;margin:0;max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.stats span{display:inline-flex;align-items:center;gap:6px}
.stats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* Search */
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:12px}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 8px 0 16px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--p-500);box-shadow:var(--focus)}
.field svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:14px 0;outline:none}
#q::placeholder{color:var(--muted)}
#q::-webkit-search-cancel-button{display:none}
kbd{font:500 12px "Geist Mono",ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--ground)}

/* Buttons (reference: primary gradient / secondary outline) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;font-size:14px;font-weight:500;line-height:1.3;padding:8px 16px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:filter .15s,background-color .15s,border-color .15s}
.btn-primary{color:#FCFCFD;background:linear-gradient(to top,var(--p-600),var(--p-top));border:1px solid rgba(255,255,255,.2);box-shadow:0 1px 2px rgba(100,0,230,.25)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{color:var(--ink-2);background:var(--card);border:1px solid var(--line)}
.btn-secondary:hover{border-color:var(--muted)}
.btn-ghost{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 10px}
.btn-ghost:hover{color:var(--ink);background:var(--line-soft)}
.btn svg{flex:none}

/* Segmented tabs (reference: pricing tabs) */
.tabs-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.tabs{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;background:var(--line-soft);border-radius:10px;padding:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--muted);font-size:14px;padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink-2)}
.tab .n{font:500 11px "Geist Mono",monospace;opacity:.8}
.tab[aria-pressed="true"]{background:var(--card);color:var(--ink-2);box-shadow:var(--tab-shadow)}
.tab[disabled]{opacity:.4;cursor:default}
.status{font-size:14px;color:var(--muted);padding-top:10px;min-height:1.6em}
.status b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* Accordion modules (reference: curriculum) */
main{display:flex;flex-direction:column;gap:12px;padding-block:8px 72px}
.module{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod-head{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:20px 24px;cursor:pointer;border-radius:12px}
.mod-head:hover{background:var(--card-hover)}
.mod-head:focus-visible{box-shadow:inset var(--focus)}
.chev{flex:none;color:var(--ink-2);transition:transform .2s ease}
.module.open .chev{transform:rotate(90deg)}
.mod-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mod-title strong{font-size:18px;font-weight:500;line-height:24px;text-wrap:balance}
.mod-title small{font-size:14px;color:var(--muted)}
.mod-info{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.mod-info b{font-weight:400;font-variant-numeric:tabular-nums}
.mod-body{border-top:1px solid var(--line-soft);padding:8px 16px 12px}
.module:not(.open) .mod-body{display:none}

.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:12px 8px;border-radius:10px}
.lesson + .lesson{border-top:1px solid var(--line-soft)}
.lesson:hover{background:var(--ground)}
.cam{grid-row:1/span 2;width:36px;height:36px;border-radius:8px;background:var(--p-soft);color:var(--p-500);display:grid;place-items:center}
.cam.off{background:var(--line-soft);color:var(--muted)}
.l-title{margin:0;font-size:16px;line-height:1.4;color:var(--ink);text-wrap:pretty}
.l-meta{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted)}
.idx{font:500 12px "Geist Mono",monospace;color:var(--muted)}
.pill{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:24px;background:var(--p-soft);color:var(--p-500)}
.pill.grey{background:var(--line-soft);color:var(--muted)}
.pill.syn{background:transparent;border:1px dashed var(--p-500);color:var(--p-500);padding:1px 7px}
.syn-note .pill{vertical-align:1px}
.l-actions{grid-column:3;grid-row:1/span 2;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.steps{grid-column:2/-1;margin:6px 0 2px;padding:12px 16px 12px 34px;background:var(--ground);border-radius:10px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.none{font-size:13px;color:var(--muted)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 2px}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;text-align:center;padding:48px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty strong{color:var(--ink);font-size:18px;font-weight:500}
.empty .btn{margin-top:8px}
footer{font-size:13px;color:var(--muted);padding-block:0 40px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (max-width:600px){
  header.top{padding-block:32px 12px}
  .mod-head{padding:16px}
  .mod-info .lbl{display:none}
  .lesson{grid-template-columns:auto 1fr}
  .l-actions{grid-column:2;grid-row:auto;justify-content:flex-start;margin-top:6px}
  .steps{grid-column:1/-1}
  .tabs-row .btn-ghost .lbl{display:none}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const STOP = new Set("de del la las el los lo en un una unos unas y o a al para por con sin mi mis tu tus su sus como que se me le les es son hay mas muy ya quiero puedo hacer".split(" "));
const stem = w => w.length > 4 && w.endsWith("es") ? w.slice(0, -2) : (w.length > 3 && w.endsWith("s") ? w.slice(0, -1) : w);
const synIndex = new Map();   // palabra (o frase) → grupos
const PHRASES = [];           // frases de varias palabras, de la más larga a la más corta
SYN.forEach((g, gi) => g.forEach(p => {
  const key = p.includes(" ") ? p : stem(p);
  if(!synIndex.has(key)) synIndex.set(key, new Set());
  synIndex.get(key).add(gi);
  if(p.includes(" ")) PHRASES.push(p);
}));
PHRASES.sort((a, b) => b.length - a.length);

// Convierte la búsqueda en términos; cada término trae su palabra literal y sus sinónimos
function parseQuery(raw){
  let q = " " + norm(raw).replace(/[^a-z0-9ñ\s-]/g, " ").replace(/\s+/g, " ") + " ";
  const terms = [];
  PHRASES.forEach(p => { if(q.includes(" " + p + " ")){ terms.push(p); q = q.replace(" " + p + " ", " "); } });
  let words = q.trim().split(" ").filter(Boolean);
  const content = words.filter(w => !STOP.has(w));
  terms.push(...(content.length ? content : words));
  return terms.map(t => {
    const lit = t.includes(" ") ? t : stem(t);
    const alts = new Set();
    (synIndex.get(lit) || []).forEach(gi => SYN[gi].forEach(p => { if(p !== t && stem(p) !== lit) alts.add(p); }));
    const altRx = [...alts].map(a => [a, toRx(a)]);
    return {raw: t, lit, alts: [...alts], litRx: t.includes(" ") || lit.length <= 3 ? toRx(lit) : null, altRx};
  });
}
// Raíz flexible: "importar" encuentra "importa", "base de datos" encuentra "bases de datos"
const root = w => { const r = w.replace(/(es|s|ar|er|ir|o|a|e)$/, ""); return r.length >= 5 ? r : w; };
const toRx = p => new RegExp("(^|[^a-z0-9])(" + p.split(" ").map(w => root(w).replace(/[-]/g, "\\-") + "[a-z0-9]*").join("\\s+") + ")", "g");
const rxTest = (rx, hay) => { rx.lastIndex = 0; return rx.test(hay); };
// Devuelve null si no coincide; si coincide, qué sinónimo se usó (o "" si fue literal)
function matchTerm(hay, term){
  if((term.lit.length > 3 ? hay.includes(term.lit) : rxTest(term.litRx, hay)) || (term.litRx && rxTest(term.litRx, hay))) return "";
  for(const [a, rx] of term.altRx) if(rxTest(rx, hay)) return a;
  return null;
}

function esc(s){return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function hl(text, terms){
  if(!terms.length) return esc(text);
  const map = [];
  for(let i=0;i<text.length;i++){ const c = norm(text[i]); for(let k=0;k<c.length;k++) map.push(i); }
  const n = norm(text), marks = new Array(text.length).fill(false);
  const mark = (a, b) => { for(let k=a;k<b;k++) marks[map[k]] = true; };
  const paintRx = rx => { rx.lastIndex = 0; let m; while((m = rx.exec(n))){ const st = m.index + m[1].length; mark(st, st + m[2].length); if(!m[0].length) rx.lastIndex++; } };
  terms.forEach(t => {
    if(t.lit.length > 3){ let p = n.indexOf(t.lit); while(p !== -1){ mark(p, p + t.lit.length); p = n.indexOf(t.lit, p + 1); } }
    if(t.litRx) paintRx(t.litRx);
    t.altRx.forEach(([, rx]) => paintRx(rx));
  });
  let out = "", on = false;
  for(let i=0;i<text.length;i++){
    if(marks[i] !== on){ out += marks[i] ? "<mark>" : "</mark>"; on = marks[i]; }
    out += esc(text[i]);
  }
  return out + (on ? "</mark>" : "");
}
function linkBtn(u, i, total, primaryUsed){

  else if(u.includes("console.twilio")) label = "Upgrade Twilio";

  return [primary, `<a class="btn ${primary ? "btn-primary" : "btn-secondary"}" href="${esc(u)}" target="_blank" rel="noopener">${isVideo ? ICON.play : ICON.ext}${label}</a>`];
}

function renderTabs(counts, total){
  const mk = (val, label, n) => `<button type="button" class="tab" data-cat="${esc(val)}" aria-pressed="${activeCat===val}" ${n || val==="" || activeCat===val ? "" : "disabled"}>${esc(label)}<span class="n">${n}</span></button>`;

}

function render(){
  const raw = $q.value.trim();
  const terms = raw ? parseQuery(raw) : [];
  $clear.hidden = !raw; $kbd.hidden = !!raw;
  // Cada tutorial guarda cuántos términos coinciden y por qué sinónimos
  const scored = items.map(it => {
    const via = []; let hits = 0;
    for(const t of terms){ const m = matchTerm(it.hay, t); if(m !== null){ hits++; if(m) via.push(m); } }
    it.via = via; it.hits = hits; return it;
  });
  let matchQ = scored.filter(it => it.hits === terms.length);
  // Si ninguno tiene todas las palabras, mostrar los que tienen al menos una (como hace Google)
  let partial = false;
  if(!matchQ.length && terms.length > 1){ matchQ = scored.filter(it => it.hits > 0); partial = matchQ.length > 0; }
  // Más palabras coincidentes primero; luego literales antes que sinónimos
  matchQ.sort((a, b) => b.hits - a.hits || a.via.length - b.via.length || a.n - b.n);
  const counts = {}; matchQ.forEach(it => counts[it.cat] = (counts[it.cat]||0) + 1);
  renderTabs(counts, matchQ.length);
  const shown = activeCat ? matchQ.filter(it => it.cat === activeCat) : matchQ;
  const forceOpen = !!(terms.length || activeCat);

  $status.innerHTML = forceOpen
    ? `<b>${shown.length}</b> ${shown.length === 1 ? "resultado" : "resultados"}${raw ? ` para “${esc(raw)}”` : ""}${activeCat ? ` en ${esc(activeCat)}` : ""}`
    : `Mostrando las <b>${cats.length}</b> secciones del manual`;
  if(partial) $status.innerHTML += ` <span class="syn-note">· ningún tutorial tiene todas las palabras; mostramos los más parecidos</span>`;
  const usedSyn = [...new Set(matchQ.flatMap(it => it.via))];
  if(usedSyn.length) $status.innerHTML += ` <span class="syn-note">· incluye resultados de ${usedSyn.slice(0, 6).map(s => `<span class="pill syn">${esc(s)}</span>`).join(" ")}${usedSyn.length > 6 ? " …" : ""}</span>`;

  if(!shown.length){
    $res.innerHTML = `<div class="empty"><strong>No hay tutoriales que coincidan</strong>Prueba con menos palabras o con un sinónimo (ej. “pipeline” → “embudo”).<button type="button" class="btn btn-primary" id="reset">Ver todos los tutoriales</button></div>`;
    $("reset").onclick = () => { $q.value = ""; activeCat = ""; render(); $q.focus(); };
    $toggle.hidden = true;
    return;
  }
  const groups = {};
  shown.forEach(it => (groups[it.cat] ||= []).push(it));
  const visibleCats = cats.filter(c => groups[c]);
  $toggle.hidden = forceOpen;
  const allOpen = visibleCats.every(c => open.has(c));
  $toggle.querySelector(".lbl").textContent = allOpen ? "Contraer todo" : "Expandir todo";

  $res.innerHTML = visibleCats.map(c => {
    const isOpen = forceOpen || open.has(c);
    const list = groups[c];
    const id = "m" + cats.indexOf(c);
    return `<section class="module${isOpen ? " open" : ""}">
      <button type="button" class="mod-head" data-cat="${esc(c)}" aria-expanded="${isOpen}" aria-controls="${id}">
        ${ICON.chev}
        <span class="mod-title"><strong>${hl(c, terms)}</strong>${catSubs[c] ? `<small>${esc(catSubs[c])}</small>` : ""}</span>
        <span class="mod-info">${ICON.list}<b>${list.length}</b><span class="lbl">${list.length === 1 ? "tutorial" : "tutoriales"}</span></span>
      </button>
      <div class="mod-body" id="${id}">${list.map(it => {
        let used = false;
        const btns = it.links.map((u, i) => { const [p, h] = linkBtn(u, i, it.links.length, used); used ||= p; return h; }).join("");
        const hasVideo = it.links.some(u => u.includes("loom.com") || u.includes("youtu"));
        return `<div class="lesson">
          <span class="cam${it.links.length ? "" : " off"}">${hasVideo ? ICON.cam : ICON.doc}</span>
          <p class="l-title">${hl(it.title, terms)}</p>
          <div class="l-actions">${btns || `<span class="none">Sin video todavía</span>`}</div>
          <div class="l-meta"><span class="idx">T${String(it.n).padStart(2,"0")}</span>${it.sub ? `<span class="pill grey">${hl(it.sub, terms)}</span>` : ""}${it.upd ? `<span class="pill">Actualizado ${esc(it.upd)}</span>` : ""}${it.via && it.via.length && terms.length ? `<span class="pill syn" title="Aparece porque buscaste un sinónimo">≈ ${esc([...new Set(it.via)].join(", "))}</span>` : ""}</div>
          ${it.steps.length ? `<ol class="steps">${it.steps.map(s => `<li>${hl(s, terms)}</li>`).join("")}</ol>` : ""}
        </div>`; }).join("")}</div>
    </section>`;
  }).join("");
}

$q.addEventListener("input", render);
$clear.addEventListener("click", () => { $q.value = ""; render(); $q.focus(); });
$tabs.addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b || b.disabled) return;
  activeCat = activeCat === b.dataset.cat ? "" : b.dataset.cat; render();
});
$res.addEventListener("click", e => {
  const h = e.target.closest(".mod-head"); if(!h) return;
  const c = h.dataset.cat, sec = h.parentElement, now = !sec.classList.contains("open");
  sec.classList.toggle("open", now); h.setAttribute("aria-expanded", now);
  now ? open.add(c) : open.delete(c);
  const allOpen = cats.every(x => open.has(x));
  $toggle.querySelector(".lbl").textContent = allOpen ? "Contraer todo" : "Expandir todo";
});
$toggle.addEventListener("click", () => {
  const allOpen = cats.every(c => open.has(c));
  cats.forEach(c => allOpen ? open.delete(c) : open.add(c)); render();
});
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $q){ e.preventDefault(); $q.focus(); }
  if(e.key === "Escape" && document.activeElement === $q){ $q.value = ""; render(); }
});
render();
</script>

</body>
</html>
